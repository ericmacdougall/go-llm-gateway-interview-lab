name: Gateway CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PostgreSQL, mTLS and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision PostgreSQL 16 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Run the same local and hosted gate
        run: ./scripts/ci.sh all
      - name: Retain the smoke-tested binary and source hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-linux-amd64-${{ github.sha }}
          path: |
            dist/ci/gateway-linux-amd64
            dist/ci/gateway-linux-amd64.sha256
            dist/ci/manifest.json
          if-no-files-found: error
          retention-days: 14
